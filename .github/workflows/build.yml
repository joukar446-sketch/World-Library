name: Find GP4

on:
  workflow_dispatch:

jobs:
  find:
    runs-on: ubuntu-22.04

    steps:
      - name: Find GP4 files
        run: |
          docker run --rm --user root \
            openorbisofficial/toolchain:latest \
            bash -c 'find /lib/OpenOrbisSDK -type f \( -name "*.gp4" -o -name "*gp4*" \) -print'
