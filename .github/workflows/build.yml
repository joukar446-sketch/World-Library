name: Build World Library - GP4 Debug

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build create-gp4
        run: |
          git clone https://github.com/OpenOrbis/create-gp4.git /tmp/create-gp4
          cd /tmp/create-gp4/cmd/create-gp4
          GO111MODULE=off go build -o /tmp/create-gp4-bin main.go

      - name: Build GP4
        run: |
          docker run --rm --user root \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "/tmp/create-gp4-bin:/tmp/create-gp4" \
            -w /workspace/ps4-app \
            openorbisofficial/toolchain:latest \
            bash -c '
              cp /tmp/create-gp4 /lib/OpenOrbisSDK/bin/linux/create-gp4
              chmod +x /lib/OpenOrbisSDK/bin/linux/create-gp4
              make pkg.gp4
            '

      - name: Show generated GP4
        run: |
          echo "========== pkg.gp4 =========="
          cat ps4-app/pkg.gp4
          echo "========== END GP4 =========="

      - name: Upload GP4
        uses: actions/upload-artifact@v4
        with:
          name: World-Library-GP4
          path: ps4-app/pkg.gp4
