name: Check PkgTool

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-22.04

    steps:
      - name: Check PkgTool help
        run: |
          docker run --rm --user root \
            openorbisofficial/toolchain:latest \
            bash -c '/lib/OpenOrbisSDK/bin/linux/PkgTool.Core --help || /lib/OpenOrbisSDK/bin/linux/PkgTool.Core help || /lib/OpenOrbisSDK/bin/linux/PkgTool.Core'
