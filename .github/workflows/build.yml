name: Build World Library PS4

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build PS4 PKG
        uses: OpenOrbis/toolchain-action@main
        with:
          version: v0.5.1
          command: |
            cd ps4-app
            make
