name: Build World Library PS4

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check OpenOrbis tools
        run: |
          docker run --rm --user root \
            openorbisofficial/toolchain:latest \
            bash -c 'echo "=== OpenOrbis tools ==="; ls -la /lib/OpenOrbisSDK/bin/linux; echo "=== GP4 tools ==="; find /lib/OpenOrbisSDK -iname "*gp4*" -o -iname "*pkg*" | head -50'
