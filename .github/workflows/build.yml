name: Build World Library

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone OpenOrbis
        run: git clone https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make python3 cmake ninja-build

      - name: Build OpenOrbis
        run: |
          export OO_PS4_TOOLCHAIN="$GITHUB_WORKSPACE/OpenOrbis-PS4-Toolchain"
          cd OpenOrbis-PS4-Toolchain
          bash extra/setup-project.sh
          make
