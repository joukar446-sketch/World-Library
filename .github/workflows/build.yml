name: Check create-gp4

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-22.04

    steps:
      - name: Inspect create-gp4
        run: |
          git clone https://github.com/OpenOrbis/create-gp4.git /tmp/create-gp4
          cd /tmp/create-gp4
          echo "=== FILES ==="
          find . -maxdepth 2 -type f -print
          echo "=== README ==="
          cat README.md || true
          echo "=== GO FILES ==="
          find . -name "*.go" -print
