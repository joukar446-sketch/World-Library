name: Check OpenOrbis Tools

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-22.04

    steps:
      - name: Check OpenOrbis tools
        run: |
          docker run --rm --user root \
            openorbisofficial/toolchain:latest \
            bash -c 'echo "=== BIN/LINUX ==="; ls -lah /lib/OpenOrbisSDK/bin/linux; echo "=== ALL GP4/PKG TOOLS ==="; find /lib/OpenOrbisSDK -type f \( -iname "*gp4*" -o -iname "*pkg*" \) -print'
