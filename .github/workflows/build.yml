name: Build World Library PS4

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with OpenOrbis
        run: |
          docker run --rm --user root \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/ps4-app \
            openorbisofficial/toolchain:latest \
            bash -c 'make'

      - name: Upload PS4 PKG
        uses: actions/upload-artifact@v4
        with:
          name: World-Library-PS4
          path: |
            ps4-app/*.pkg
            ps4-app/*.gp4
