name: Build World Library

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build create-gp4
        run: |
          git clone https://github.com/OpenOrbis/create-gp4.git /tmp/create-gp4
          cd /tmp/create-gp4
          go build -o "$RUNNER_TEMP/create-gp4" ./cmd/create-gp4

      - name: Build World Library
        run: |
          docker run --rm --user root \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$RUNNER_TEMP/create-gp4:/lib/OpenOrbisSDK/bin/linux/create-gp4" \
            -w /workspace/ps4-app \
            openorbisofficial/toolchain:latest \
            bash -c 'make'

      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: World-Library-PKG
          path: ps4-app/*.pkg
