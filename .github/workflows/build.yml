ame: Build World Library

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test OpenOrbis Docker Toolchain
        run: |
          docker run --rm \
            -w /workspace \
            -v "$GITHUB_WORKSPACE:/workspace" \
            openorbisofficial/toolchain:latest \
            bash -c 'echo "OpenOrbis OK"; echo "Toolchain: $OO_TOOLCHAIN_VERSION"; ls -la'

